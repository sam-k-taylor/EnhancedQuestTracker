<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background tile with gold frame -->
  <rect x="8" y="8" width="496" height="496" rx="72" fill="#1e160d" stroke="#b8862b" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="56" fill="none" stroke="#5a4020" stroke-width="4"/>

  <!-- Tracker list: zone header, then quests coloured by difficulty -->
  <g stroke-linecap="round">
    <!-- zone header -->
    <rect x="80" y="104" width="30" height="8" rx="4" fill="#ffffff"/>
    <rect x="126" y="100" width="180" height="16" rx="8" fill="#ffffff"/>

    <!-- quest rows: level pill + title bar, then objective line -->
    <rect x="112" y="156" width="44" height="26" rx="8" fill="#40c040"/>
    <rect x="170" y="160" width="150" height="18" rx="9" fill="#40c040"/>
    <rect x="140" y="200" width="120" height="10" rx="5" fill="#9a8a70"/>

    <rect x="112" y="240" width="44" height="26" rx="8" fill="#ffd100"/>
    <rect x="170" y="244" width="130" height="18" rx="9" fill="#ffd100"/>
    <rect x="140" y="284" width="100" height="10" rx="5" fill="#9a8a70"/>

    <rect x="112" y="324" width="44" height="26" rx="8" fill="#ff8040"/>
    <rect x="170" y="328" width="110" height="18" rx="9" fill="#ff8040"/>
    <rect x="140" y="368" width="130" height="10" rx="5" fill="#9a8a70"/>
  </g>

  <!-- Quest "!" marker -->
  <g transform="translate(386 270)" stroke="#3a2200" stroke-width="10" stroke-linejoin="round" fill="#ffc21a">
    <path d="M -34 -140 L 34 -140 L 20 60 L -20 60 Z"/>
    <circle cx="0" cy="118" r="30"/>
  </g>
</svg>
